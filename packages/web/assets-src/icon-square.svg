<!--
  Full-bleed variant for iOS and Android. Both platforms apply their own mask, so this one skips
  the rounded corners and keeps the bolt inside the inner 80% safe zone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>HypeFuel</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b332b" />
      <stop offset="1" stop-color="#04211b" />
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#97fce4" />
      <stop offset="1" stop-color="#8ff3d9" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="url(#tile)" />

  <g transform="translate(16 16) scale(1.333)">
    <path
      d="M13.4 2 4 13.6h5.7L8.9 22 20 9.9h-6.2L13.4 2Z"
      fill="url(#bolt)"
      stroke="url(#bolt)"
      stroke-width="1.2"
      stroke-linejoin="round"
    />
  </g>
</svg>
