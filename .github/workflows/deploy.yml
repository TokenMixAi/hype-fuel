name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/web/**"
      - "packages/sdk/**"
      - ".github/workflows/deploy.yml"
  # Allows deploying without a code change.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare
    runs-on: ubuntu-latest
    # Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
    # RELAYER_PRIVATE_KEY is a Worker secret managed with `wrangler secret put`, so it is
    # deliberately not exposed to CI.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @hypefuel/sdk build

      - name: Deploy relayer API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/api

      - name: Build web
        run: pnpm --filter @hypefuel/web build

      - name: Deploy web
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/web
